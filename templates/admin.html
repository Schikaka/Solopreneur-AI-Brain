<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workspace Admin - NarrativeAI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111827'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Arial' font-size='30' font-weight='700' fill='white'%3EN%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;750;800&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-strong: #111827;
        --text: #172033;
        --muted: #667085;
        --line: #e2e8f0;
        --blue: #2563eb;
        --slate: #334155;
        --teal: #0f766e;
        --amber: #b45309;
        --green: #15803d;
        --red: #b42318;
        --shadow: 0 18px 45px rgba(20, 32, 55, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(15, 118, 110, 0.09), rgba(15, 118, 110, 0) 320px),
          var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .shell {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 22px 0 38px;
      }

      .topbar,
      .brand,
      .top-actions,
      .status {
        display: flex;
        align-items: center;
      }

      .topbar {
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 32px;
      }

      .brand {
        gap: 12px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 8px;
        background: var(--surface-strong);
        color: white;
      }

      .top-actions {
        gap: 14px;
      }

      .nav-link {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--slate);
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
      }

      .nav-link:hover {
        border-color: #94a3b8;
        background: #f8fafc;
      }

      .status {
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
      }

      .page-head {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-end;
        margin-bottom: 18px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 34px;
        line-height: 1.08;
        letter-spacing: 0;
      }

      h2 {
        font-size: 18px;
        letter-spacing: 0;
      }

      .page-head p {
        max-width: 560px;
        margin-top: 10px;
        color: var(--muted);
        line-height: 1.55;
      }

      .admin-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 18px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .settings-card {
        overflow: hidden;
      }

      .settings-tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        padding: 16px 16px 0;
      }

      .settings-tab {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
      }

      .settings-tab[aria-selected="true"] {
        border-color: #bfdbfe;
        background: #eff6ff;
        color: #1e3a8a;
      }

      .settings-panel {
        padding: 18px;
      }

      .settings-panel[hidden] {
        display: none;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .logo-input {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        opacity: 0;
        white-space: nowrap;
      }

      .logo-picker {
        display: grid;
        min-height: 126px;
        place-items: center;
        padding: 18px;
        border: 1px dashed #94a3b8;
        border-radius: 8px;
        background: #f8fafc;
        color: var(--slate);
        cursor: pointer;
        text-align: center;
      }

      .logo-picker:hover {
        border-color: var(--blue);
        background: #f1f5f9;
      }

      .logo-picker strong,
      .logo-picker span {
        display: block;
      }

      .logo-picker strong {
        color: var(--text);
        font-size: 14px;
      }

      .logo-picker span {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      .logo-preview {
        display: flex;
        min-height: 62px;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
      }

      .logo-preview img {
        display: block;
        width: auto;
        max-width: 160px;
        max-height: 54px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        object-fit: contain;
      }

      .license-control {
        display: grid;
        grid-template-columns: 1fr 42px;
        gap: 8px;
      }

      .license-input {
        width: 100%;
        min-height: 42px;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcff;
        color: var(--text);
        font-size: 14px;
        font-weight: 700;
      }

      .license-input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        outline: none;
      }

      .icon-button {
        display: grid;
        min-height: 42px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: var(--slate);
        cursor: pointer;
      }

      .icon-button:hover {
        border-color: #94a3b8;
        background: #f8fafc;
      }

      .icon-button svg {
        width: 18px;
        height: 18px;
        stroke-width: 2;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .button {
        min-height: 40px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: var(--blue);
        color: white;
        cursor: pointer;
        font-size: 14px;
        font-weight: 750;
      }

      .button.secondary {
        border: 1px solid var(--line);
        background: white;
        color: var(--text);
      }

      .button:hover {
        filter: brightness(0.97);
      }

      .admin-status {
        min-height: 22px;
        margin-top: 14px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .admin-status.success {
        color: var(--green);
        font-weight: 700;
      }

      .admin-status.error {
        color: var(--red);
        font-weight: 700;
      }

      .summary-panel {
        padding: 18px;
      }

      .summary-panel h2 {
        margin-bottom: 12px;
      }

      .status-list {
        display: grid;
        gap: 0;
        margin: 0;
        border-top: 1px solid var(--line);
      }

      .status-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 5px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
      }

      .status-row dt {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .status-row dd {
        margin: 0;
        color: var(--text);
        font-size: 14px;
        font-weight: 750;
      }

      .status-row dd.ready {
        color: var(--green);
      }

      .status-row dd.pending {
        color: var(--amber);
      }

      .audit-panel-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
      }

      .audit-list {
        display: grid;
        gap: 10px;
      }

      .audit-entry {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcff;
      }

      .audit-entry.is-anomaly {
        border-color: #fecaca;
        background: #fef2f2;
      }

      .audit-entry strong,
      .audit-entry span {
        display: block;
      }

      .audit-entry strong {
        color: var(--text);
        font-size: 14px;
        line-height: 1.35;
      }

      .audit-entry span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .audit-entry.is-anomaly span.audit-flag {
        color: var(--red);
        font-weight: 800;
      }

      .audit-link {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--text);
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
      }

      .audit-link[aria-disabled="true"] {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .empty {
        padding: 24px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 760px) {
        .shell {
          width: min(100% - 20px, 980px);
          padding-top: 16px;
        }

        .topbar,
        .page-head,
        .top-actions {
          align-items: flex-start;
          flex-direction: column;
        }

        .admin-layout {
          grid-template-columns: 1fr;
        }

        .settings-tabs,
        .audit-entry {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="mark" aria-hidden="true">N</div>
          <span>NarrativeAI</span>
        </div>
        <div class="top-actions">
          <a class="nav-link" href="/">Report Builder</a>
          <div class="status"><span class="dot" aria-hidden="true"></span><span>Admin ready</span></div>
        </div>
      </header>

      <section class="page-head">
        <div>
          <h1>Workspace Admin</h1>
          <p>Manage client report branding and protected access away from the main presentation screen.</p>
        </div>
      </section>

      <div class="admin-layout">
        <section class="panel settings-card" aria-label="Workspace settings">
          <div class="settings-tabs" role="tablist" aria-label="Workspace settings">
            <button class="settings-tab" id="branding-tab" type="button" role="tab" aria-selected="true" aria-controls="branding-panel">Branding</button>
            <button class="settings-tab" id="access-tab" type="button" role="tab" aria-selected="false" aria-controls="access-panel">Access</button>
            <button class="settings-tab" id="audit-tab" type="button" role="tab" aria-selected="false" aria-controls="audit-panel">Audit</button>
          </div>

          <div class="settings-panel" id="branding-panel" role="tabpanel" aria-labelledby="branding-tab">
            <div class="field">
              <label for="agency-logo">Agency Logo</label>
              <input class="logo-input" id="agency-logo" type="file" accept="image/png,image/jpeg">
              <label class="logo-picker" for="agency-logo">
                <span>
                  <strong>Upload Agency Logo</strong>
                  <span>PNG or JPG for report headers</span>
                </span>
              </label>
            </div>
            <div class="logo-preview" id="logo-preview">No logo uploaded</div>
            <div class="actions">
              <button class="button secondary" id="remove-logo" type="button">Remove Logo</button>
            </div>
            <div class="admin-status" id="branding-status" role="status" aria-live="polite"></div>
          </div>

          <div class="settings-panel" id="access-panel" role="tabpanel" aria-labelledby="access-tab" hidden>
            <div class="field">
              <label for="license-key">License Key</label>
              <div class="license-control">
                <input class="license-input" id="license-key" type="password" placeholder="Enter license key" autocomplete="off" spellcheck="false">
                <button class="icon-button" id="toggle-license" type="button" aria-label="Show license key">
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>
            <div class="actions">
              <button class="button" id="save-access" type="button">Save Access</button>
              <button class="button secondary" id="clear-access" type="button">Clear</button>
            </div>
            <div class="admin-status" id="access-status" role="status" aria-live="polite"></div>
          </div>

          <div class="settings-panel" id="audit-panel" role="tabpanel" aria-labelledby="audit-tab" hidden>
            <div class="audit-panel-head">
              <h2>Generated Reports</h2>
              <button class="button secondary" id="refresh-audit" type="button">Refresh</button>
            </div>
            <div class="audit-list" id="audit-list"></div>
            <div class="admin-status" id="audit-status" role="status" aria-live="polite"></div>
          </div>
        </section>

        <aside class="panel summary-panel" aria-label="Workspace status">
          <h2>Workspace Status</h2>
          <dl class="status-list">
            <div class="status-row">
              <dt>Access</dt>
              <dd id="access-state">Checking</dd>
            </div>
            <div class="status-row">
              <dt>Branding</dt>
              <dd id="branding-state">Checking</dd>
            </div>
            <div class="status-row">
              <dt>Gatekeeper</dt>
              <dd class="ready">Configured</dd>
            </div>
            <div class="status-row">
              <dt>Audit</dt>
              <dd id="audit-state">Checking</dd>
            </div>
          </dl>
        </aside>
      </div>
    </main>

    <script nonce="{{ csp_nonce }}">
      const logoStorageKey = "narrativeai.agencyLogo";
      const licenseStorageKey = "narrativeai.licenseKey";
      const logoInput = document.querySelector("#agency-logo");
      const logoPreview = document.querySelector("#logo-preview");
      const removeLogoButton = document.querySelector("#remove-logo");
      const brandingStatus = document.querySelector("#branding-status");
      const brandingState = document.querySelector("#branding-state");
      const licenseInput = document.querySelector("#license-key");
      const licenseToggle = document.querySelector("#toggle-license");
      const saveAccessButton = document.querySelector("#save-access");
      const clearAccessButton = document.querySelector("#clear-access");
      const accessStatus = document.querySelector("#access-status");
      const accessState = document.querySelector("#access-state");
      const auditState = document.querySelector("#audit-state");
      const auditList = document.querySelector("#audit-list");
      const auditStatus = document.querySelector("#audit-status");
      const refreshAuditButton = document.querySelector("#refresh-audit");
      const settingsTabs = document.querySelectorAll(".settings-tab");
      const settingsPanels = document.querySelectorAll(".settings-panel");
      const sampleReportCacheKey = "narrativeai.sampleReport";
      const sampleReportCacheTtlMs = 6 * 60 * 60 * 1000;
      const historyDbName = "narrativeai.localHistoryVault";
      const historyDbVersion = 1;
      const historyStoreName = "reports";
      const gatekeeperAuditBase = {{ gatekeeper_url|tojson }};
      let agencyLogoDataUrl = localStorage.getItem(logoStorageKey) || "";
      let historyDbPromise = null;

      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[char]);

      function setStatus(element, message, kind = "") {
        element.className = kind ? `admin-status ${kind}` : "admin-status";
        element.textContent = message;
      }

      function updateSummary() {
        const hasLicense = Boolean((localStorage.getItem(licenseStorageKey) || "").trim());
        const hasLogo = Boolean(localStorage.getItem(logoStorageKey));
        accessState.textContent = hasLicense ? "Protected" : "Needs setup";
        accessState.className = hasLicense ? "ready" : "pending";
        brandingState.textContent = hasLogo ? "Logo ready" : "Default brand";
        brandingState.className = hasLogo ? "ready" : "pending";
      }

      function openHistoryVault() {
        if (!("indexedDB" in window)) {
          return Promise.reject(new Error("Local History Vault is unavailable in this browser."));
        }
        if (historyDbPromise) {
          return historyDbPromise;
        }
        historyDbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open(historyDbName, historyDbVersion);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(historyStoreName)) {
              const store = db.createObjectStore(historyStoreName, { keyPath: "id" });
              store.createIndex("createdAt", "createdAt", { unique: false });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => {
            historyDbPromise = null;
            reject(request.error || new Error("Local History Vault could not be opened."));
          };
        });
        return historyDbPromise;
      }

      function transactionDone(transaction) {
        return new Promise((resolve, reject) => {
          transaction.oncomplete = () => resolve();
          transaction.onerror = () => reject(transaction.error || new Error("Local History Vault transaction failed."));
          transaction.onabort = () => reject(transaction.error || new Error("Local History Vault transaction was aborted."));
        });
      }

      function requestResult(request) {
        return new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("Local History Vault request failed."));
        });
      }

      async function readHistoryReports() {
        const db = await openHistoryVault();
        const transaction = db.transaction(historyStoreName, "readonly");
        const request = transaction.objectStore(historyStoreName).getAll();
        const records = await requestResult(request);
        await transactionDone(transaction);
        return records.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
      }

      function reportHistoryTitle(record) {
        return record?.report?.stats?.top_campaign || "Marketing report";
      }

      function reportHistoryDate(record) {
        try {
          const savedAt = new Date(record.createdAt);
          if (Number.isNaN(savedAt.getTime())) {
            return "Saved report";
          }
          return savedAt.toLocaleString([], {
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          });
        } catch (error) {
          return "Saved report";
        }
      }

      function reportAudit(record) {
        return record?.report?.audit || {};
      }

      function reportId(record) {
        return record?.report?.report_id || reportAudit(record).report_id || "";
      }

      function renderAuditList(records = []) {
        if (!records.length) {
          auditList.innerHTML = '<div class="empty">No generated reports saved locally.</div>';
          auditState.textContent = "No reports";
          auditState.className = "pending";
          return;
        }

        auditList.innerHTML = records.map((record) => {
          const audit = reportAudit(record);
          const id = reportId(record);
          const hasAnomaly = Boolean(audit.math_anomaly_detected);
          const href = id ? `${gatekeeperAuditBase}/admin/audit/${encodeURIComponent(id)}` : "#";
          return `
            <article class="audit-entry ${hasAnomaly ? "is-anomaly" : ""}">
              <div>
                <strong>${escapeHtml(reportHistoryTitle(record))}</strong>
                <span>${escapeHtml(reportHistoryDate(record))} - ${escapeHtml(record.sourceLabel || "Local report")}</span>
                <span class="audit-flag">${hasAnomaly ? "Math anomaly detected" : (id ? "Audit clean" : "Audit unavailable")}</span>
              </div>
              <a class="audit-link" href="${escapeHtml(href)}" target="_blank" rel="noopener" ${id ? "" : 'aria-disabled="true"'}>View Audit</a>
            </article>
          `;
        }).join("");
        const anomalyCount = records.filter((record) => reportAudit(record).math_anomaly_detected).length;
        auditState.textContent = anomalyCount ? `${anomalyCount} flagged` : "Clean";
        auditState.className = anomalyCount ? "pending" : "ready";
      }

      async function refreshAuditList() {
        try {
          const records = await readHistoryReports();
          renderAuditList(records);
          setStatus(auditStatus, records.length ? `${records.length} report${records.length === 1 ? "" : "s"} indexed for audit.` : "");
          return records;
        } catch (error) {
          auditList.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
          auditState.textContent = "Unavailable";
          auditState.className = "pending";
          setStatus(auditStatus, error.message, "error");
          return [];
        }
      }

      function updateLogoPreview() {
        logoPreview.innerHTML = agencyLogoDataUrl
          ? `<img src="${agencyLogoDataUrl}" alt="Agency logo preview"><span>Logo ready for reports</span>`
          : "No logo uploaded";
        updateSummary();
      }

      function readSampleReportCache() {
        try {
          const cached = JSON.parse(sessionStorage.getItem(sampleReportCacheKey) || "null");
          if (!cached?.data || !cached?.savedAt) {
            return null;
          }

          if (Date.now() - cached.savedAt > sampleReportCacheTtlMs) {
            sessionStorage.removeItem(sampleReportCacheKey);
            return null;
          }

          return cached.data;
        } catch (error) {
          sessionStorage.removeItem(sampleReportCacheKey);
          return null;
        }
      }

      async function warmSampleReportCache() {
        if (readSampleReportCache()) {
          return;
        }

        const licenseKey = (localStorage.getItem(licenseStorageKey) || "").trim() || "DEMO123";
        try {
          const response = await fetch(`/api/sample?license_key=${encodeURIComponent(licenseKey)}`);
          const data = await response.json();
          if (response.ok) {
            sessionStorage.setItem(sampleReportCacheKey, JSON.stringify({
              data,
              savedAt: Date.now()
            }));
          }
        } catch (error) {
          sessionStorage.removeItem(sampleReportCacheKey);
        }
      }

      settingsTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          settingsTabs.forEach((item) => {
            item.setAttribute("aria-selected", String(item === tab));
          });
          settingsPanels.forEach((panel) => {
            panel.hidden = panel.id !== tab.getAttribute("aria-controls");
          });
          if (tab.getAttribute("aria-controls") === "audit-panel") {
            refreshAuditList();
          }
        });
      });

      logoInput.addEventListener("change", () => {
        const logoFile = logoInput.files[0];
        if (!logoFile) {
          return;
        }

        if (!logoFile.type.match(/^image\/(png|jpeg)$/)) {
          setStatus(brandingStatus, "Upload a PNG or JPEG logo.", "error");
          return;
        }

        const reader = new FileReader();
        reader.addEventListener("load", () => {
          agencyLogoDataUrl = reader.result;
          localStorage.setItem(logoStorageKey, agencyLogoDataUrl);
          updateLogoPreview();
          setStatus(brandingStatus, "Branding saved.", "success");
        });
        reader.readAsDataURL(logoFile);
      });

      removeLogoButton.addEventListener("click", () => {
        agencyLogoDataUrl = "";
        logoInput.value = "";
        localStorage.removeItem(logoStorageKey);
        updateLogoPreview();
        setStatus(brandingStatus, "Branding cleared.", "success");
      });

      licenseInput.value = localStorage.getItem(licenseStorageKey) || "";
      licenseToggle.addEventListener("click", () => {
        const shouldShow = licenseInput.type === "password";
        licenseInput.type = shouldShow ? "text" : "password";
        licenseToggle.setAttribute("aria-label", shouldShow ? "Hide license key" : "Show license key");
      });

      saveAccessButton.addEventListener("click", () => {
        const licenseKey = licenseInput.value.trim();
        if (!licenseKey) {
          localStorage.removeItem(licenseStorageKey);
          updateSummary();
          setStatus(accessStatus, "Access needs a key before CSV analysis.", "error");
          return;
        }

        localStorage.setItem(licenseStorageKey, licenseKey);
        updateSummary();
        setStatus(accessStatus, "Access saved.", "success");
      });

      clearAccessButton.addEventListener("click", () => {
        licenseInput.value = "";
        localStorage.removeItem(licenseStorageKey);
        updateSummary();
        setStatus(accessStatus, "Access cleared.", "success");
      });

      refreshAuditButton.addEventListener("click", () => refreshAuditList());

      updateLogoPreview();
      updateSummary();
      refreshAuditList();
      warmSampleReportCache();
    </script>
  </body>
</html>
